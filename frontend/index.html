<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111318" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LiveTranslate" />  <title>LiveTranslate</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #111318;
      color: #f0f0f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
      font-weight: 600;
      color: #9ecbff;
    }

    .lang-select {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lang-select label {
      font-size: 0.85rem;
      color: #9aa0a6;
    }

    #targetLang {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1c1f26;
      color: #f0f0f0;
    }

    .main-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      background: #4285f4;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .main-btn:active {
      transform: scale(0.97);
    }

    .main-btn.active {
      background: #db4437;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .pause-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #1c1f26;
      color: #f0f0f0;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .pause-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pause-btn.paused {
      background: #f4b400;
      color: black;
    }

    .status {
      font-size: 0.95rem;
      color: #9aa0a6;
      min-height: 1.2em;
    }

.subtitles {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .live-line {
      min-height: 70px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #1c1f26;
    }

    .subtitles-log {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-entry {
      padding: 12px 14px;
      border-radius: 10px;
      background: #181a20;
      border-left: 3px solid #4285f4;
    }

    .log-entry .in {
      font-size: 0.85rem;
      color: #9aa0a6;
      margin-bottom: 4px;
    }

    .log-entry .out {
      font-size: 1rem;
      color: #f0f0f0;
      font-weight: 500;
    }

    .line-in {
      font-size: 0.9rem;
      color: #9aa0a6;
      min-height: 1.3em;
    }

    .line-out {
      font-size: 1.15rem;
      color: #f0f0f0;
      font-weight: 500;
      min-height: 1.6em;
    }

    .volume-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-row label {
      font-size: 0.85rem;
      color: #9aa0a6;
      white-space: nowrap;
    }

    .volume-row input {
      flex: 1;
    }
  </style>
</head>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
</script>

<body>
  <div class="app">
    <h1>LiveTranslate</h1>

    <div class="lang-select">
      <label for="targetLang">Langue</label>
      <select id="targetLang">
        <option value="ky" selected>Kirghize</option>
        <option value="tr">Turc</option>
        <option value="uz">Ouzbek</option>
        <option value="ru">Russe</option>
        <option value="es">Espagnol</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="mainBtn" class="main-btn">Démarrer</button>
      <button id="pauseBtn" class="pause-btn" disabled>⏸</button>
    </div>

    <div id="statusText" class="status">Prêt</div>

    <div class="subtitles">
      <div class="live-line">
        <div id="lineIn" class="line-in"></div>
        <div id="lineOut" class="line-out"></div>
      </div>
      <div id="subtitlesLog" class="subtitles-log"></div>
    </div>

    <div class="volume-row">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="100" value="80" />
    </div>
  </div>

  <script src="geminilive.js"></script>
  <script src="mediaUtils.js"></script>
  <script src="script.js"></script>
</body>

</html>
